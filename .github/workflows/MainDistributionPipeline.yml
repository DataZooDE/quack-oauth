#
# This workflow calls the main distribution pipeline from DuckDB to build,
# test and (optionally) release the extension.
#
# Architectures we explicitly exclude:
#   windows_amd64_mingw -- vcpkg's OpenSSL port on MinGW is fragile;
#     sibling extensions (anofox-tabular, erpl-web) also skip it.
#   wasm_mvp / wasm_eh / wasm_threads -- excluded (issue #3). The wasm
#     loadable side-module (emcc -sSIDE_MODULE=2) links only the libraries
#     named in duckdb_extension_load(... LINKED_LIBS ...); without OpenSSL
#     there, jwt-cpp's crypto symbols are unresolved and the module fails to
#     LOAD in the browser -- a failure invisible to CI (the side-module still
#     *builds* green because symbol resolution is deferred to load time).
#     OAuth's interactive/redirect flows aren't viable in wasm anyway, so a
#     clean "not available on wasm" beats an unloadable artifact. The
#     EMSCRIPTEN source guards (DUCKDB_NATIVE_ONLY_SOURCES + #ifndef
#     EMSCRIPTEN) stay in place for a possible future LINKED_LIBS-based wasm
#     build, but no wasm job is emitted today.
#
# Build matrix:
#   - duckdb-stable-* jobs build against the current stable DuckDB
#     (v1.5.3). The repo's submodules are pinned to this version.
#   - duckdb-lts-* jobs build against the 1.4 LTS line (v1.4.4). They
#     override the duckdb / extension-ci-tools versions via workflow
#     inputs; the upstream reusable workflow handles the submodule
#     checkout to the LTS tag itself.
# Both pairs publish under their own /v<ver>/ path on S3 via
# scripts/extension-upload.sh -- there are no naming collisions.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

# OIDC token needed for AWS credentials in the deploy job. Build job
# doesn't need it but the upstream reusable workflow tolerates extra
# permissions at the caller level.
permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries (v1.5.3)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.3
    with:
      duckdb_version: v1.5.3
      ci_tools_version: v1.5.3
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-stable-deploy:
    name: Deploy extension binaries (v1.5.3)
    needs: duckdb-stable-build
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.3
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      # Mirror erpl-web: push on tag-or-main. PRs and feature branches
      # build and verify but never publish.
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}

  duckdb-lts-build:
    name: Build extension binaries (v1.4.4 LTS)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.4.4
    with:
      duckdb_version: v1.4.4
      ci_tools_version: v1.4.4
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-lts-deploy:
    name: Deploy extension binaries (v1.4.4 LTS)
    needs: duckdb-lts-build
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.4.4
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
