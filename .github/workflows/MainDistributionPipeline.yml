#
# This workflow calls the main distribution pipeline from DuckDB to build,
# test and (optionally) release the extension.
#
# Architectures we explicitly exclude:
#   windows_amd64_mingw -- vcpkg's OpenSSL port on MinGW is fragile;
#     sibling extensions (anofox-tabular, erpl-web) also skip it.
#
# Architectures enabled (incl. the wasm trio, R-N-8): the wasm-hostile
# code paths (HTTP-bound scalars: check_token / login / refresh /
# device_login + the duckdb_httplib_openssl http client) are excluded
# from the wasm build via DUCKDB_NATIVE_ONLY_SOURCES in CMakeLists.txt
# and the matching #ifndef EMSCRIPTEN guards in quack_oauth_extension.cpp.
# The wasm binary registers settings + SECRET types + diagnose() +
# audit_log() + current_principal() + check_authorization +
# check_token (1-arg, no HTTP) -- enough for a host-page-managed
# token flow where the JS layer hands the extension a pre-acquired
# bearer.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

# OIDC token needed for AWS credentials in the deploy job. Build job
# doesn't need it but the upstream reusable workflow tolerates extra
# permissions at the caller level.
permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries (v1.5.2)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.2
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5.2
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw'

  duckdb-stable-deploy:
    name: Deploy extension binaries (v1.5.2)
    needs: duckdb-stable-build
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.2
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw'
      # Mirror erpl-web: push on tag-or-main. PRs and feature branches
      # build and verify but never publish.
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
