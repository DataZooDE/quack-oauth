#
# This workflow calls the main distribution pipeline from DuckDB to build,
# test and (optionally) release the extension.
#
# Architectures we explicitly exclude:
#   windows_amd64_mingw -- vcpkg's OpenSSL port on MinGW is fragile;
#     sibling extensions (anofox-tabular, erpl-web) also skip it.
#   wasm_mvp / wasm_eh / wasm_threads -- excluded (issue #3). The wasm
#     loadable side-module (emcc -sSIDE_MODULE=2) links only the libraries
#     named in duckdb_extension_load(... LINKED_LIBS ...); without OpenSSL
#     there, jwt-cpp's crypto symbols are unresolved and the module fails to
#     LOAD in the browser -- a failure invisible to CI (the side-module still
#     *builds* green because symbol resolution is deferred to load time).
#     OAuth's interactive/redirect flows aren't viable in wasm anyway, so a
#     clean "not available on wasm" beats an unloadable artifact. The
#     EMSCRIPTEN source guards (DUCKDB_NATIVE_ONLY_SOURCES + #ifndef
#     EMSCRIPTEN) stay in place for a possible future LINKED_LIBS-based wasm
#     build, but no wasm job is emitted today.
#
# Build matrix:
#   - duckdb-stable-* jobs build against the current stable DuckDB
#     (v1.5.6), using v1.5-variegata build tooling.
#   - duckdb-next-build builds and tests the 2.0 alpha, without publishing it.
#   - duckdb-lts-* jobs build against the 1.4 LTS line: DuckDB *source*
#     v1.4.5 (via duckdb_version), but using the v1.5.5 extension-ci-tools
#     reusable workflow + tooling (the `@v1.5.5` ref and ci_tools_version).
#     Why not @v1.4.5: that workflow leaves the Windows compiler to
#     autodetect, and the current windows-latest image then picks MinGW g++,
#     which (a) trips the C++17 std::byte vs Win-SDK `byte` ambiguity and
#     (b) can't link the MSVC-built vcpkg OpenSSL. The v1.5.5 workflow pins
#     the Windows compiler to MSVC `cl`, so the LTS
#     build works on the same runners. We still verify 1.4 LTS API
#     compatibility because the DuckDB headers/library compiled against are
#     v1.4.5.
# The stable and LTS release lines publish under their own /v<ver>/ path on S3 via
# scripts/extension-upload.sh -- there are no naming collisions.
#
name: Main Extension Distribution Pipeline
on:
  push:
    branches: [main]
    tags: ['**']
  pull_request:
  workflow_dispatch:

# OIDC token needed for AWS credentials in the deploy job. Build job
# doesn't need it but the upstream reusable workflow tolerates extra
# permissions at the caller level.
permissions:
  id-token: write
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' || github.sha }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries (v1.5.6)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5-variegata
    with:
      duckdb_version: v1.5.6
      ci_tools_version: v1.5-variegata
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-stable-smoke-test:
    name: Smoke test (v1.5.6)
    needs: duckdb-stable-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.5.6
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-stable-deploy:
    name: Deploy extension binaries (v1.5.5)
    needs: [duckdb-stable-build, duckdb-stable-smoke-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.5.6
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      # Mirror erpl-web: push on tag-or-main. PRs and feature branches
      # build and verify but never publish.
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths (<name>/vYYYY.MM.DD/...) come ONLY from the tag run. A main
      # push of the same commit builds before the tag exists (stamp vX-N-gSHA), and its
      # deploy resolves the tag at upload time: if it runs after the tag run it
      # overwrites the release with that pre-tag build (hit duckdb-gdrive v2026.10.17).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}

  duckdb-next-build:
    name: Build extension binaries (v2.0 pre-release)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v2.0-cyanoptera
    with:
      duckdb_version: d54cbbe3df17e8e5ce68312f483b4155836112aa
      ci_tools_version: v2.0-cyanoptera
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-lts-build:
    name: Build extension binaries (v1.4.5 LTS)
    # DuckDB source v1.4.5, but built with the v1.5.5 tooling (forces MSVC cl
    # on Windows). See the header comment for the rationale.
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.5
    with:
      duckdb_version: v1.4.5
      ci_tools_version: v1.5.5
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-lts-smoke-test:
    name: Smoke test (v1.4.5)
    needs: duckdb-lts-build
    uses: ./.github/workflows/_extension_smoke_test.yml
    with:
      duckdb_version: v1.4.5
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'

  duckdb-lts-deploy:
    name: Deploy extension binaries (v1.4.5 LTS)
    needs: [duckdb-lts-build, duckdb-lts-smoke-test]
    if: startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_extension_deploy.yml
    secrets: inherit
    with:
      duckdb_version: v1.4.5
      # Match the LTS build job's tooling so the deploy arch matrix lines up
      # with the artifacts the build produced (see duckdb-lts-build).
      ci_tools_version: v1.5.5
      extension_name: quack_oauth
      exclude_archs: 'windows_amd64_mingw;wasm_mvp;wasm_eh;wasm_threads'
      deploy_latest: ${{ startsWith(github.ref, 'refs/tags/v') || github.ref == 'refs/heads/main' }}
      # Versioned paths (<name>/vYYYY.MM.DD/...) come ONLY from the tag run. A main
      # push of the same commit builds before the tag exists (stamp vX-N-gSHA), and its
      # deploy resolves the tag at upload time: if it runs after the tag run it
      # overwrites the release with that pre-tag build (hit duckdb-gdrive v2026.10.17).
      deploy_versioned: ${{ startsWith(github.ref, 'refs/tags/v') }}
