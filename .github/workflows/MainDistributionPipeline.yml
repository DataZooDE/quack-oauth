#
# This workflow calls the main distribution pipeline from DuckDB to build,
# test and (optionally) release the extension.
#
# Architectures we explicitly exclude (until a slice proves them green):
#   wasm_mvp / wasm_eh / wasm_threads -- our source-side wasm gating is
#     in place (S-14) but the wasm32-emscripten vcpkg build of OpenSSL +
#     jwt-cpp + picojson has not yet been validated. Tracked in
#     docs/IMPLEMENTATION.md "Deferred items".
#   windows_amd64_mingw -- vcpkg's OpenSSL port on MinGW is fragile;
#     sibling extensions (anofox-tabular, erpl-web) also skip it.
#
name: Main Extension Distribution Pipeline
on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.head_ref || '' }}-${{ github.base_ref || '' }}-${{ github.ref != 'refs/heads/main' && github.sha || '' }}
  cancel-in-progress: true

jobs:
  duckdb-stable-build:
    name: Build extension binaries (v1.5.2)
    uses: duckdb/extension-ci-tools/.github/workflows/_extension_distribution.yml@v1.5.2
    with:
      duckdb_version: v1.5.2
      ci_tools_version: v1.5.2
      extension_name: quack_oauth
      exclude_archs: 'wasm_mvp;wasm_eh;wasm_threads;windows_amd64_mingw'
