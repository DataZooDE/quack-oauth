[project]
name = "quack-oauth-demo"
version = "0.0.1"
description = "Live demo: uv-launched quack + quack-oauth server with NYC taxi data, GitHub OAuth, and a DuckDB-Wasm + Perspective pivot client."
requires-python = ">=3.11"
dependencies = [
    "aiohttp>=3.10",
    "duckdb==1.5.2",
    "python-dotenv>=1.0",
]

[project.scripts]
quack-oauth-demo = "quack_oauth_demo.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["quack_oauth_demo"]
